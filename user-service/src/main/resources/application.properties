spring.application.name=ledgr-user-service
server.port=8082

# Origins allowed to call this API (VS Code Live Server)
ledgr.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

spring.datasource.url=jdbc:mysql://localhost:3306/ledgr_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
