spring.application.name=ledgr-transaction-service
# Each microservice runs on its own port: Transaction Service 8081, User Service 8082
server.port=8081

# Origins allowed to call this API (VS Code Live Server)
ledgr.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/ledgr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
